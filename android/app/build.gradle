// El Chavo Kart — Android Evolved
// Default: diagnostic APK (launcher + Vulkan probe + Vulkan test; no recompiled game).
// -PwithGame: also builds the recompiled game (root CMakeLists.txt) once it can run on Android.
plugins { id 'com.android.application' }

def withGame = project.hasProperty('withGame')
def sdkRoot = file('../../references/nfsmw-android/sdk')

android {
    namespace 'com.codepdbh.chavokart'
    compileSdk 35
    ndkVersion '28.2.13676358'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'com.codepdbh.chavokart'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName withGame ? '0.1.0-experimental' : '0.1.0-diagnostic'
        buildConfigField 'boolean', 'WITH_GAME', withGame ? 'true' : 'false'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_shared', "-DCK_SDK_ROOT=${sdkRoot.absolutePath.replace(File.separator, '/')}",
                    "-DCK_WITH_GAME=${withGame ? 'ON' : 'OFF'}"
            targets 'SDL3-shared', 'ckdiag', 'ckprobe'
            if (withGame) targets 'chavokart', 'rexruntime', 'rexgpu-xenos', 'rex_android_gpu_driver',
                    'adrenotools', 'main_hook', 'hook_impl', 'file_redirect_hook', 'gsl_alloc_hook'
        } }
    }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets.main.java.srcDirs += ["${sdkRoot}/thirdparty/sdl3/android-project/app/src/main/java"]
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.30.5' } }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        // Local experimental builds are signed with the debug key; public releases need the developer's key.
        // CMake Release (not AGP's default RelWithDebInfo): the SDK suffixes RelWithDebInfo libraries with "rd",
        // and libadrenotools loads its hook libraries (libmain_hook.so, ...) by their exact names.
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
    }
}
